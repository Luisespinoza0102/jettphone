<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle del Producto - Jettphone</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="img/icono.jpg">
</head>
<body>

    <div style="padding: 30px 50px;">
        <a href="index.html" class="back-link">&larr; Volver al Catálogo</a>
    </div>

    <div id="product-content" class="product-detail-container">
        <p style="color: #888; text-align: center; grid-column: 1/-1; padding: 50px;">Cargando detalles...</p>
    </div>

    <script src="db.js"></script>
    <script>
        async function initDetail() {
            const urlParams = new URLSearchParams(window.location.search);
            const pid = urlParams.get('p');
            const container = document.getElementById('product-content');

            const p = await getProductById(pid);

            if (p) {
                container.innerHTML = `
                    <div class="detail-image-section">
                        <div class="main-img-container">
                            <img id="main-view" src="${p.imagenes && p.imagenes.length > 0 ? p.imagenes[0] : 'img/icono.jpg'}" alt="${p.title}">
                        </div>
                        <div class="thumbnail-grid">
                            ${p.imagenes ? p.imagenes.map((img, i) => `
                                <img src="${img}" class="thumb ${i===0?'active':''}" onclick="changeImg(this, '${img}')">
                            `).join('') : ''}
                        </div>
                    </div>
                    <div class="detail-info">
                        <h1>${p.title}</h1>
                        <span class="detail-price">${p.price}</span>
                        <p class="shipping-info">${p.shipping || '🚚 Entregas personales sin costo adicional'}</p>
                        <div class="detail-desc">${p.description}</div>
                        <a href="https://wa.me/584246259603?text=${encodeURIComponent(p.wa_msg || 'Hola Jettphone, estoy interesado en este producto.')}" class="btn-buy-wa" target="_blank">
                            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="white"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.008-.57-.008-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>
                            Comprar por WhatsApp
                        </a>
                    </div>
                `;
            } else {
                container.innerHTML = "<h2 style='color:white; text-align:center; grid-column:1/-1;'>Producto no encontrado</h2>";
            }
        }

        function changeImg(el, src) {
            document.getElementById('main-view').src = src;
            document.querySelectorAll('.thumb').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
        }

        document.addEventListener("DOMContentLoaded", initDetail);
    </script>
</body>
</html>
